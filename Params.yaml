# ============================================================================
# MICROEXON SACS PIPELINE - CONFIGURATION FILE
# Wren Lab - Alzheimer's Disease Microexon Splicing Analysis
# ============================================================================

# Stage 1: Data Preparation
data_prep:
  psi_threshold: 0.8              # Minimum PSI for high-quality microexons
  flank_size: 250                 # Flanking window size for splice sites (bp)
  control_buffer: 1000            # Buffer around MEs for control region exclusion (bp)
  min_intron_size: 300            # Minimum intron size for control regions (bp)
  controls_per_me: 5              # Number of matched control regions per ME

# Stage 2: Chromatin Mark Processing
chromatin_marks:
  marks:
    - DNase
    - H3K27ac
    - H3K27me3
    - CTCF
  
  # Peak overlap requirements
  peak_overlap_mode: "any"        # "any" sample or "majority" samples
  
  # Signal thresholds
  dnase_top_percentile: 0.80      # Top 20% threshold for DNase signal
  h3k27ac_top_percentile: 0.80    # Top 20% threshold for H3K27ac signal

# Stage 3: SACS Scoring System
sacs:
  # Component weights (for reference, actual scoring is binary)
  dnase_signal_score: 1           # +1 if top 20% accessibility
  dnase_peak_score: 1             # +1 if hypersensitivity peak present
  h3k27ac_score: 1                # +1 if top 20% active mark
  h3k27me3_score: -1              # -1 if repressive peak present
  ctcf_score: 1                   # +1 if insulator peak present
  
  # Score range: -1 to 4
  min_score: -1
  max_score: 4
  high_sacs_threshold: 4          # MEs with max SACS for validation

# Stage 4: Differential Analysis
differential:
  dpsi_threshold: 0.10            # Minimum |dPSI| for biological significance
  min_samples_per_group: 5        # Minimum samples for statistical testing
  p_value_threshold: 0.05         # Nominal p-value threshold
  fdr_threshold: 0.05             # FDR-adjusted p-value threshold
  cognitive_levels:
    - "NCI"
    - "MCI"  
    - "AD"

# Stage 5: HOMER Motif Analysis
homer:
  window_size: 250                # Window around microexons for motif search (bp)
  genome: "hg38"                  # Reference genome
  top_n_regions: 50               # Number of top differential MEs per condition
  mask_repeats: true              # Mask repetitive elements
  background_mode: "automatic"    # HOMER background selection

# Output settings
output:
  save_intermediate: true         # Save intermediate files for debugging
  figure_format: "pdf"            # Primary figure format (pdf/png/both)
  figure_dpi: 300                 # DPI for raster figures
  table_format: "csv"             # Output table format (csv/tsv)

# Computational resources
resources:
  threads: 8                      # Number of threads for parallel operations
  memory_gb: 32                   # Memory allocation in GB
  time_hours: 24                  # Max walltime for SLURM jobs
